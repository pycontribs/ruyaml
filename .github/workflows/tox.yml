name: gh

on:
  pull_request:
jobs:
  gh:
    name: ${{ matrix.name }}
    # Official Python 3.7 builds require Ubuntu 22.04; retain that legacy lane.
    runs-on: ${{ matrix.name == 'py37' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: linters
          python-version: "3.11"
        # - name: docs
        #   python-version: 3.8
        #   continue-on-error: true
        - name: packaging
          python-version: 3.13
        - name: py37
          python-version: 3.7
        - name: py38
          python-version: 3.8
        - name: py39
          python-version: 3.9
        - name: py310
          python-version: "3.10"
        - name: py311
          python-version: "3.11"
        - name: py312
          python-version: "3.12"
        - name: py313
          python-version: "3.13"
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # needed by setuptools-scm
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: >-
        Log the currently selected Python
        version info (${{ matrix.python-version }})
      run: |
        python --version --version
        which python
    - name: Pip cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ env.PY_SHA256 }}-${{ hashFiles('setup.cfg', 'tox.ini', 'pyproject.toml', '.pre-commit-config.yaml', 'pytest.ini') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-
    - name: Install tox
      run: |
        python3 -m pip install --upgrade tox
    - name: Log installed dists
      run: >-
        python3 -m pip freeze --all
    - name: "Test with tox"
      run: |
        python3 -m tox
      env:
        TOXENV: ${{ matrix.name }}
    - name: Archive logs
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: logs-${{ matrix.name }}
        path: .tox/**/log/
        include-hidden-files: true
  check:
    if: always()
    needs:
      - gh
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful test matrix
        env:
          MATRIX_RESULT: ${{ needs.gh.result }}
        run: test "$MATRIX_RESULT" = success
        shell: bash
